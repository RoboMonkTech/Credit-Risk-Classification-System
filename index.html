<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Risk Classification System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left-panel">

        <h1>Credit Risk Classification</h1>

        <p class="subtitle">
            Machine Learning Based Loan Risk Prediction
        </p>

        <!-- Applicant Name -->
        <div class="form-group">
            <label for="name">Applicant Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter Applicant Name">
        </div>

        <!-- Age -->
        <div class="form-group">
            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                placeholder="Enter Age"
                min="18"
                max="100">
        </div>

        <!-- Gender -->
        <div class="form-group">
            <label for="sex">Gender</label>

            <select id="sex">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <!-- Job -->
        <div class="form-group">
            <label for="job">Job Level</label>

            <select id="job">
                <option value="0">0 - Unskilled / Non-resident</option>
                <option value="1">1 - Unskilled / Resident</option>
                <option value="2">2 - Skilled</option>
                <option value="3">3 - Highly Skilled</option>
            </select>
        </div>

        <!-- Housing -->
        <div class="form-group">
            <label for="housing">Housing</label>

            <select id="housing">
                <option value="Own">Own</option>
                <option value="Rent">Rent</option>
                <option value="Free">Free</option>
            </select>
        </div>

        <!-- Saving -->
        <div class="form-group">
            <label for="saving">Saving Account</label>

            <select id="saving">
                <option value="Little">Little</option>
                <option value="Moderate">Moderate</option>
                <option value="Quite Rich">Quite Rich</option>
                <option value="Rich">Rich</option>
            </select>
        </div>

        <!-- Checking -->
        <div class="form-group">
            <label for="checking">Checking Account</label>

            <select id="checking">
                <option value="Little">Little</option>
                <option value="Moderate">Moderate</option>
                <option value="Rich">Rich</option>
            </select>
        </div>

        <!-- Credit -->
        <div class="form-group">
            <label for="credit">Credit Amount</label>

            <input
                type="number"
                id="credit"
                placeholder="Enter Credit Amount"
                min="1">
        </div>

        <!-- Duration -->
        <div class="form-group">
            <label for="duration">Duration (Months)</label>

            <input
                type="number"
                id="duration"
                placeholder="Enter Loan Duration"
                min="1">
        </div>

        <!-- Purpose -->
        <div class="form-group">
            <label for="purpose">Purpose</label>

            <select id="purpose">
                <option value="Car">Car</option>
                <option value="Education">Education</option>
                <option value="Furniture">Furniture</option>
                <option value="Business">Business</option>
                <option value="Radio/TV">Radio/TV</option>
                <option value="Repairs">Repairs</option>
            </select>
        </div>

        <!-- Button -->
        <button type="button" onclick="predictRisk()">
            Predict Credit Risk
        </button>

    </div>


    <!-- RIGHT SIDE -->
    <div class="right-panel">

        <h2>Prediction Result</h2>

        <div class="result-card">

            <div id="emoji" class="emoji">
                🏦
            </div>

            <h3 id="result">
                Waiting for Prediction...
            </h3>

            <p id="confidence">
                Confidence : --
            </p>

            <p id="recommendation">
                Enter customer information and click Predict.
            </p>

        </div>

    </div>

</div>

<!-- IMPORTANT: JavaScript file -->
<script src="script.js"></script>

</body>
</html>
